<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html">Budgeting</a>
            <nav>
                <ul class="navbar">
                <li><a class="active" href="login.html">Masuk</a></li>
                </ul>
            </nav>
        </div>

    <main class="container">
        <section class="card login-box">
            <h1>Selamat datang</h1>

            <img src="https://e7.pngegg.com/pngimages/882/225/png-clipart-google-logo-google-logo-google-search-icon-google-text-logo-thumbnail.png" alt="Google Icon">
        
            <form action="index.html" method="get">
                <button type="submit" class="btn btn-google btn-block">
                Masuk dengan Google
                </button>
            </form>
        
            <p class="login-note">Kami memakai akun Google untuk identitas masuk.</p>
        </section>
    </main>
