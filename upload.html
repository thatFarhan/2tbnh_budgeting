<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Transaksi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Budgeting App</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="upload.html">Upload</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="upload-container">
        <section class="upload-card">
            <h2>Tambah Transaksi Baru</h2>
            <p class="subtitle">Catat pengeluaranmu dengan detail agar keuangan tetap terkontrol.</p>

            <!-- Action melempar ke dashboard, tanpa atribut method (otomatis fallback ke GET) -->
            <form action="dashboard.html">
                
                <div class="form-group">
                    <label for="judul">Judul Transaksi</label>
                    <input type="text" id="judul" name="judul" placeholder="Contoh: Makan Siang di Kantin" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="kategori">Kategori</label>
                        <select id="kategori" name="kategori" required>
                            <option value="" disabled selected>Pilih Kategori...</option>
                            <option value="makanan">Makanan</option>
                            <option value="transportasi">Transportasi</option>
                            <option value="belanja">Belanja</option>
                            <option value="hiburan">Hiburan</option>
                            <option value="tagihan">Tagihan</option>
                            <option value="kesehatan">Kesehatan</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="harga">Jumlah Pengeluaran</label>
                        <div class="input-prefix">
                            <span>Rp</span>
                            <input type="number" id="harga" name="harga" placeholder="0" min="0" required>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tanggal">Tanggal Transaksi</label>
                        <input type="date" id="tanggal" name="tanggal" required>
                    </div>

                    <div class="form-group">
                        <label for="pembayaran">Metode Pembayaran</label>
                        <select id="pembayaran" name="pembayaran" required>
                            <option value="" disabled selected>Pilih Metode...</option>
                            <option value="cash">Cash</option>
                            <option value="debit">Debit Card</option>
                            <option value="credit">Credit Card</option>
                            <option value="ewallet">E-Wallet</option>
                            <option value="transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="catatan">Catatan Tambahan</label>
                    <textarea id="catatan" name="catatan" rows="3" placeholder="Tambahkan detail opsional di sini..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-cancel">Batal</button>
                    <button type="submit" class="btn-submit">Simpan Transaksi</button>
                </div>
            </form>

        </section>
    </main>

</body>
</html>
